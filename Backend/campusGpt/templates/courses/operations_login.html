{% extends 'base.html' %}

{% block title %}Operational Staff Login - CampusGPT{% endblock %}

{% block content %}
<div class="min-h-screen bg-slate-100 flex items-center justify-center px-4">
    <form method="post" class="w-full max-w-md bg-white border border-slate-200 rounded-lg p-8 space-y-5">
        {% csrf_token %}
        <div>
            <h1 class="text-2xl font-bold text-slate-900">Operational Staff Login</h1>
            <p class="text-sm text-slate-500">For librarians, guards, assistants, and campus operations staff.</p>
        </div>
        <input name="username" class="w-full border border-slate-300 rounded-md p-3" placeholder="Username" required>
        <input name="password" type="password" class="w-full border border-slate-300 rounded-md p-3" placeholder="Password" required>
        <button class="w-full bg-slate-900 text-white rounded-md py-3 font-semibold">Login</button>
    </form>
</div>
{% endblock %}
